<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>📋 To-Do List</h1>
  <p class="subtitle">نظم يومك وحقق أهدافك</p>

  <div class="input-area">
    <input type="text" id="taskInput" placeholder="اكتب مهمة جديدة...">
    <button onclick="addTask()">+ إضافة</button>
  </div>
<div class="search-area">
  <input type="text" id="searchInput" placeholder="بحث...">
  <button onclick="searchTask()">بحث</button>
</div>

  <h3>قائمة المهام</h3>
  <ul id="taskList"></ul>

  <p class="footer">💙 كل مهمة صغيرة تقربك من هدفك الكبير</p>

</div>

<script src="script.js"></script>
</body>
</html>
